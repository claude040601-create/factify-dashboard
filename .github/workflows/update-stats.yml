name: Update channel stats
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:         # lets you run it manually
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: YouTube stats
        run: node scripts/fetch-stats.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_HANDLE: ${{ vars.YT_HANDLE }}
      - name: Instagram stats
        run: node scripts/fetch-instagram.mjs
        continue-on-error: true      # a problem with Instagram never blocks the YouTube update
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - name: Save data
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data.json
          if [ -f data-ig.json ]; then git add data-ig.json; fi
          git diff --staged --quiet || (git commit -m "Update stats" && git pull --rebase && git push)
