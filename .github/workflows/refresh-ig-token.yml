name: Refresh Instagram token
on:
  schedule:
    - cron: '30 21 * * 0'    # every Monday, 3:00 AM India time
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renew the 60-day Instagram key
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$IG_TOKEN" ]; then echo "IG_TOKEN not set yet."; exit 0; fi
          RES=$(curl -s "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=$IG_TOKEN")
          NEW=$(echo "$RES" | jq -r '.access_token // empty')
          EXP=$(echo "$RES" | jq -r '.expires_in // empty')
          if [ -z "$NEW" ]; then echo "Refresh failed:"; echo "$RES" | jq -r '.error.message // "unknown error"'; exit 1; fi
          echo "::add-mask::$NEW"
          SAVED=false
          if [ -n "$GH_TOKEN" ]; then
            gh secret set IG_TOKEN --body "$NEW" --repo "$GITHUB_REPOSITORY" && SAVED=true
          else
            echo "GH_PAT secret not set: the renewed key could not be saved back. Add GH_PAT so this stays automatic."
          fi
          node -e '
            const fs = require("fs");
            let d = {}; try { d = JSON.parse(fs.readFileSync("data-ig.json","utf8")); } catch {}
            d.token = { refreshedAt: new Date().toISOString(), expiresAt: new Date(Date.now() + Number(process.argv[1]) * 1000).toISOString(), saved: process.argv[2] === "true" };
            fs.writeFileSync("data-ig.json", JSON.stringify(d, null, 1));
          ' "$EXP" "$SAVED"
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data-ig.json
          git diff --staged --quiet || (git commit -m "Instagram key renewed" && git pull --rebase && git push)
