<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d1442">
<title>Factify Hindi · Live Growth</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<header>
  <img id="avatar" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%233b2a7a'/%3E%3C/svg%3E">
  <div>
    <h1 id="chName">Factify Hindi</h1>
    <p id="chSub">Live growth dashboard</p>
  </div>
  <div class="spacer"></div>
  <a class="btn" href="https://studio.youtube.com" target="_blank" rel="noopener">YT Studio ↗</a>
  <button class="btn" id="refreshBtn">↻</button>
</header>

<section class="stats">
  <div class="stat glass"><div class="label">Subscribers</div><div class="value" id="subs">—</div><div class="delta" id="subsD"></div></div>
  <div class="stat glass"><div class="label">Total Views</div><div class="value" id="views">—</div><div class="delta" id="viewsD"></div></div>
  <div class="stat glass"><div class="label">Videos</div><div class="value" id="videos">—</div><div class="delta" id="videosD"></div></div>
  <div class="stat glass"><div class="label">Avg views / video</div><div class="value" id="avg">—</div><div class="delta" id="avgD"></div></div>
</section>

<section class="grid2">
  <div class="panel glass">
    <h2>Growth
      <select id="metric">
        <option value="subs">Subscribers</option>
        <option value="views">Views</option>
        <option value="videos">Videos</option>
      </select>
    </h2>
    <div class="chartbox"><canvas id="chart"></canvas></div>
    <div class="empty" id="chartNote" style="display:none"></div>
  </div>
  <div class="panel glass">
    <h2>Latest uploads</h2>
    <div class="vids" id="vids"><div class="empty">Loading…</div></div>
  </div>
</section>

<footer>
  <span id="updated">Loading…</span>
  <span>Stats refresh every 30 min · YouTube rounds public subscriber counts</span>
</footer>

<script src="app.js"></script>
</body>
</html>
