<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factify Hindi · Stats</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Cormorant Garamond',Georgia,serif;
    background:#fbfaf5; color:#2b2b2b;
    display:flex;align-items:center;justify-content:center;
  }
  /* add ?dark to the link for a transparent, white-text version */
  body.dark{background:transparent;color:#f5f3ea;text-shadow:0 1px 8px rgba(0,0,0,.6)}
  a{color:inherit;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
  .row{display:flex;justify-content:center;gap:clamp(18px,8vw,48px);width:100%}
  .stat{text-align:center}
  .num{font-size:clamp(28px,11vw,52px);font-weight:400;line-height:1;letter-spacing:.5px}
  .lbl{font-size:clamp(11px,3.4vw,14px);letter-spacing:3px;text-transform:uppercase;opacity:.65;margin-top:6px}
  .div{width:1px;background:currentColor;opacity:.25}
  .name{font-size:clamp(12px,3.6vw,15px);letter-spacing:2px;opacity:.7;font-style:italic}
</style>
</head>
<body>
<a href="./" target="_blank" rel="noopener" title="Open full dashboard">
  <div class="row">
    <div class="stat"><div class="num" id="subs">—</div><div class="lbl">Subscribers</div></div>
    <div class="div"></div>
    <div class="stat"><div class="num" id="views">—</div><div class="lbl">Views</div></div>
  </div>
  <div class="name" id="name">Factify Hindi</div>
</a>
<script>
  if (location.search.includes('dark')) document.body.classList.add('dark');
  const fmt = n => n == null ? '—' :
    Intl.NumberFormat('en-IN', {notation: n >= 10000 ? 'compact' : 'standard', maximumFractionDigits: 1}).format(n);
  async function load(){
    try{
      const d = await (await fetch('data.json?t=' + Date.now())).json();
      document.getElementById('subs').textContent = d.latest.subs == null ? 'Hidden' : fmt(d.latest.subs);
      document.getElementById('views').textContent = fmt(d.latest.views);
      document.getElementById('name').textContent = d.channel.title;
    }catch(e){}
  }
  load();
  setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
